<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- BizLink Monogram Mark: Two interconnected geometric nodes forming a "B" -->
  <rect width="32" height="32" rx="7" fill="#2563EB"/>
  <!-- Top Node / First Business Link -->
  <path d="M9 7h7.5c2.485 0 4.5 2.015 4.5 4.5s-2.015 4.5-4.5 4.5H9V7z" fill="#FFFFFF"/>
  <rect x="12" y="10" width="4" height="2" rx="1" fill="#2563EB"/>
  <!-- Bottom Node / Interlocking Partner Link -->
  <path d="M9 15h8.5c2.761 0 5 2.239 5 5s-2.239 5-5 5H9V15z" fill="#FFFFFF"/>
  <rect x="12" y="18" width="5" height="3" rx="1.5" fill="#2563EB"/>
  <!-- Geometric link bridge connector -->
  <rect x="9" y="7" width="3.5" height="18" fill="#FFFFFF"/>
</svg>
